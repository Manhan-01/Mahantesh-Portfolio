<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello in 12 Languages</title>
  <style>
    body {
      background: black;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* 4 columns */
      gap: 10px;
      width: 95%;
      max-width: 1600px; /* optional limit */
    }
    .cell {
      background: #141414;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      border-radius: 10px;
      font-weight: bold;
      aspect-ratio: 9 / 16; /* forces 9:16 ratio */
    }
    /* Different colors for each hello */
    .cell:nth-child(1) { color: #FF6B6B; }
    .cell:nth-child(2) { color: #FFD93D; }
    .cell:nth-child(3) { color: #6BCB77; }
    .cell:nth-child(4) { color: #4D96FF; }
    .cell:nth-child(5) { color: #FF7B54; }
    .cell:nth-child(6) { color: #9D4EDD; }
    .cell:nth-child(7) { color: #00C49A; }
    .cell:nth-child(8) { color: #FF5DA2; }
    .cell:nth-child(9) { color: #FCA311; }
    .cell:nth-child(10) { color: #3A86FF; }
    .cell:nth-child(11) { color: #8338EC; }
    .cell:nth-child(12) { color: #06D6A0; }
  </style>
</head>
<body>
  <div class="grid">
    <div class="cell">ನಮಸ್ಕಾರ</div>
    <div class="cell">नमस्ते</div>
    <div class="cell">Hello</div>
    <div class="cell">Hola</div>
    <div class="cell">Bonjour</div>
    <div class="cell">Hallo</div>
    <div class="cell">Ciao</div>
    <div class="cell">Olá</div>
    <div class="cell">Привет</div>
    <div class="cell">你好</div>
    <div class="cell">こんにちは</div>
    <div class="cell">안녕하세요</div>
  </div>
</body>
</html>
